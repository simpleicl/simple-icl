# @package _global_

defaults:
- override /data: robotwin
- override /model: shared_video_action
- _self_
batch_size: 16
num_workers: 8
model:
  mot_checkpoint_mixed_attn: false
  action_dit_pretrained_path: ${oc.env:SIMPLEICL_ACTION_INIT,./checkpoints/action_init.pt}
  video_dit_config:
    has_video_all_condition: false
  action_dit_config:
    video_all_context_dim: null
data:
  train:
    dataset_dirs:
    - ${oc.env:SIMPLEICL_DATASET,./data/train_lerobot}
    pretrained_norm_stats:
    - ${oc.env:SIMPLEICL_DATASET,./data/train_lerobot}/dataset_stats.json
    video_all_size: null
    text_embedding_cache_dir: ${oc.env:SIMPLEICL_TEXT_CACHE,./outputs/cache/text}
lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500
mode: vae_fix
use_lora: true
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
